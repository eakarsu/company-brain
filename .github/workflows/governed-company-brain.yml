name: governed-company-brain
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brain_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d brain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/brain_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: npm --prefix backend test
      - run: npm --prefix frontend run build
      - run: npm --prefix backend audit --audit-level=moderate
      - run: npm --prefix frontend audit --audit-level=moderate
      - run: node --check backend/server.js && node --check backend/governance/service.cjs
      - run: bash -n start.sh
